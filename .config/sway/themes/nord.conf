# ~/.config/sway/themes/nord.conf
# Nord Dark Theme Configuration

# ========================
# Nord Color Palette
# ========================
# Polar Night - darkest
set $nord0  #2E3440
# Polar Night - dark
set $nord1  #3B4252
# Polar Night - medium
set $nord2  #434C5E
# Polar Night - light
set $nord3  #4C566A
# Snow Storm - dark
set $nord4  #D8DEE9
# Snow Storm - medium
set $nord5  #E5E9F0
# Snow Storm - light
set $nord6  #ECEFF4
# Frost - cyan
set $nord7  #8FBCBB
# Frost - bright blue
set $nord8  #88C0D0
# Frost - blue
set $nord9  #81A1C1
# Frost - dark blue
set $nord10 #5E81AC
# Aurora - red
set $nord11 #BF616A
# Aurora - orange
set $nord12 #D08770
# Aurora - yellow
set $nord13 #EBCB8B
# Aurora - green
set $nord14 #A3BE8C
# Aurora - purple
set $nord15 #B48EAD

# ========================
# Window Border Colors
# ========================
set $border_focused   $nord10
set $bg_focused       $nord2
set $text_focused     $nord6
set $indicator_focused $nord8
set $border_inactive  $nord3
set $bg_inactive      $nord0
set $text_inactive    $nord4
set $indicator_inactive $nord7
set $border_unfocus   $nord1
set $bg_unfocus       $nord0
set $text_unfocus     $nord4
set $indicator_unfocus $nord3
set $border_urgent    $nord11
set $bg_urgent        $nord11
set $text_urgent      $nord6
set $indicator_urgent $nord11

# ========================
# Status Bar Colors
# ========================
set $bar_bg           $nord0
set $bar_text         $nord4

# Focused workspace (currently active)
set $bar_focused_workspace_border $nord8
set $bar_focused_workspace_bg     $nord2
set $bar_focused_workspace_text   $nord6

# Active workspace (visible but not focused)
set $bar_active_workspace_border  $nord9
set $bar_active_workspace_bg      $nord1
set $bar_active_workspace_text    $nord4

# Inactive workspace
set $bar_inactive_workspace_border $nord1
set $bar_inactive_workspace_bg     $nord0
set $bar_inactive_workspace_text   $nord3

# Urgent workspace
set $bar_urgent_workspace_border  $nord11
set $bar_urgent_workspace_bg      $nord11
set $bar_urgent_workspace_text    $nord6

# Binding mode
set $bar_binding_mode_border      $nord13
set $bar_binding_mode_bg          $nord13
set $bar_binding_mode_text        $nord0

# ========================
# Background Color
# ========================
set $wallpaper_color $nord0

# ========================
# GTK Theme Settings
# ========================
set $gtk_theme "Nordic"
set $icon_theme "Nordzy-dark"
set $cursor_theme "Adwaita"
set $color_scheme "prefer-dark"

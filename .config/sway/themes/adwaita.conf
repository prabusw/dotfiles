# ~/.config/sway/themes/adwaita.conf  
# Adwaita Light Theme Configuration

# ========================
# Adwaita Color Palette
# ========================
set $adwaita_white      #FFFFFF
set $adwaita_light_1    #F6F5F4
set $adwaita_light_2    #F1F0EE
set $adwaita_light_3    #DEDDDA
set $adwaita_light_4    #C0BFBC
set $adwaita_dark_1     #9A9996
set $adwaita_dark_2     #5E5C64
set $adwaita_dark_3     #3D3846
set $adwaita_dark_4     #241F31
set $adwaita_blue       #3584E4
set $adwaita_light_blue #62A0EA
set $adwaita_dark_blue  #1C71D8
set $adwaita_green      #33D17A
set $adwaita_yellow     #F6D32D
set $adwaita_orange     #FF7800
set $adwaita_red        #E01B24
set $adwaita_purple     #9141AC

# ========================
# Window Border Colors
# ========================
set $border_focused   $adwaita_blue
set $bg_focused       $adwaita_light_1
set $text_focused     $adwaita_dark_3
set $indicator_focused $adwaita_light_blue
set $border_inactive  $adwaita_light_3
set $bg_inactive      $adwaita_white
set $text_inactive    $adwaita_dark_2
set $indicator_inactive $adwaita_light_4
set $border_unfocus   $adwaita_light_4
set $bg_unfocus       $adwaita_white
set $text_unfocus     $adwaita_dark_1
set $indicator_unfocus $adwaita_light_3
set $border_urgent    $adwaita_red
set $bg_urgent        $adwaita_red
set $text_urgent      $adwaita_white
set $indicator_urgent $adwaita_red

# ========================
# Status Bar Colors
# ========================
set $bar_bg           $adwaita_light_1
set $bar_text         $adwaita_dark_3

# Focused workspace (currently active)
set $bar_focused_workspace_border $adwaita_blue
set $bar_focused_workspace_bg     $adwaita_blue
set $bar_focused_workspace_text   $adwaita_white

# Active workspace (visible but not focused)
set $bar_active_workspace_border  $adwaita_light_blue
set $bar_active_workspace_bg      $adwaita_light_2
set $bar_active_workspace_text    $adwaita_dark_2

# Inactive workspace
set $bar_inactive_workspace_border $adwaita_light_3
set $bar_inactive_workspace_bg     $adwaita_light_1
set $bar_inactive_workspace_text   $adwaita_dark_1

# Urgent workspace
set $bar_urgent_workspace_border  $adwaita_red
set $bar_urgent_workspace_bg      $adwaita_red
set $bar_urgent_workspace_text    $adwaita_white

# Binding mode
set $bar_binding_mode_border      $adwaita_orange
set $bar_binding_mode_bg          $adwaita_orange
set $bar_binding_mode_text        $adwaita_white

# ========================
# Background Color
# ========================
set $wallpaper_color $adwaita_light_1

# ========================
# GTK Theme Settings
# ========================
set $gtk_theme "Adwaita"
set $icon_theme "Adwaita"
set $cursor_theme "Adwaita"
set $color_scheme "prefer-light"
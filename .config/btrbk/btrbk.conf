# This file is maintained as a literate file in
# 20240317210436-btrbk.org
transaction_log            /var/log/btrbk.log
compat busybox
stream_buffer              512m
incremental                yes
lockfile                   /var/lock/btrbk.lock
snapshot_preserve_min      2d
target_preserve_min        no
target_preserve            7d 4w 12m 0y
archive_preserve_min       latest
archive_preserve           12m 0y
ssh_identity               /etc/btrbk/ssh/id_rsa
volume /mnt/btrfs
  snapshot_dir             _btrbk_snap
  snapshot_create          always
  target send-receive      /mnt/backup/_btrbk
  subvolume  @alpine
    target_preserve        7d 4w 1m 0y
  subvolume  @mint
    target_preserve        1d 1w 1m 0y
  subvolume  @rescue
    target_preserve        1d 1w 1m 0y
  subvolume  @home
  subvolume  @audio
  subvolume  @video
  subvolume  @photos
  subvolume  @docs
  subvolume  @myhome
  subvolume  @shared

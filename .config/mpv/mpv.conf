# osc-visibility=always
# This section applies to everything
replaygain=track
replaygain-clip=yes
# ao=pipewire
# ao=alsa
# af=lavfi=[pan=5.1|FL=FL+0.5*FC|FR=FR+0.5*FC|BL=0.5*FL|BR=0.5*FR|FC=FC|LFE=LFE]
# The below gives proper LFE output
[stereo-upmix]
profile-cond=get("audio-params/channel-count") == 2
af=lavfi=[pan=5.1|FL=FL|FR=FR|BL=0.7*FL|BR=0.7*FR|FC=0.5*FL+0.5*FR|LFE=0.5*FL+0.5*FR]
# audio-channels=5.1
# This profile triggers only for MP3 files
[extension.mp3]
no-video

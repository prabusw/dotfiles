# bold-text-in-bright=no
# word-delimiters=,│`|:"'()[]{}<>
# selection-target=primary
# workers=<number of logical CPUs>

[main]

initial-color-theme=dark

[colors-dark]

# Based on nord theme
alpha=0.9

# cursor = 2e3440 d8dee9

foreground = d8dee9
background = 2e3440

selection-foreground = d8dee9
selection-background = 4c566a

regular0 = 3b4252
regular1 = bf616a
regular2 = a3be8c
regular3 = ebcb8b
regular4 = 81a1c1
regular5 = b48ead
regular6 = 88c0d0
regular7 = e5e9f0

bright0 = 4c566a
bright1 = bf616a
bright2 = a3be8c
bright3 = ebcb8b
bright4 = 81a1c1
bright5 = b48ead
bright6 = 8fbcbb
bright7 = eceff4

dim0 = 373e4d
dim1 = 94545d
dim2 = 809575
dim3 = b29e75
dim4 = 68809a
dim5 = 8c738c
dim6 = 6d96a5
dim7 = aeb3bb

[colors-light]
# # Nord Light Theme - Background (Snow Storm) and Foreground (Polar Night)

# # Base Colors (Background/Foreground)
# Background: nord6 (brightest Snow Storm)
background=ECEFF4
# # Foreground: nord3 (darkest Polar Night - recommended for primary text on light background)
foreground=4C566A

# # "Black" (regular0) and "White" (regular7) - These are the most common cause of contrast issues!
# # regular0: nord3 (Used for dark text, now clearly visible)
regular0=4C566A
# # regular7: nord4 (Used for light gray text, but must be dark enough for contrast)
regular7=D8DEE9

# # Regular Colors (Tones)
regular1=BF616A    # Red (nord11)
regular2=A3BE8C    # Green (nord14)
regular3=EBCB8B    # Yellow (nord13)
regular4=81A1C1    # Blue (nord9)
regular5=B48EAD    # Magenta (nord15)
regular6=88C0D0    # Cyan (nord8)


# bright0: nord2
bright0=434C5E
# bright7: nord3 (Using dark text again for maximum contrast on light background, instead of nord5/6 which would be too light)
bright7=4C566A

# Bright Colors (Tones)
bright1=BF616A     # Bright Red (nord11)
bright2=A3BE8C     # Bright Green (nord14)
bright3=EBCB8B     # Bright Yellow (nord13)
bright4=81A1C1     # Bright Blue (nord9)
bright5=B48EAD     # Bright Magenta (nord15)
bright6=88C0D0     # Bright Cyan (nord8)


